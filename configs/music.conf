# Reduced teaching version of TESSERA zoom P00000/R0000.
# Source: /snap7/scratch/dp004/dc-love2/tessera/v0tessera/zooms/P00000/R0000
[setup]
boxlength    = 1600.0
zstart       = 63
levelmin     = 6
levelmin_TF  = 8
levelmax     = 10
baryons      = no
use_2LPT     = yes
padding      = 10
align_top    = no

region            = ellipsoid
region_point_file = tessera_P00000_R0000_region_points.txt

[execution]
NumThreads = 8

[cosmology]
Omega_m       = 0.37714739
Omega_L       = 0.62285261
Omega_b       = 0.06898468
H0            = 66.979059
sigma_8       = 0.72076891
n_s           = 0.94807754
w_0           = -0.47977999
w_a           = -2.23444064
transfer      = camb_file
transfer_file = tessera_P00000_camb_transfer.dat

[random]
seed[10] = 65536

[poisson]
fft_fine      = yes
accuracy      = 1e-6
grad_order    = 6
laplace_order = 6

[output]
format   = swift
filename = zoom_ics.hdf5
